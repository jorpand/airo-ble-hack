name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La CI usa mise, igual que el desarrollo local: las versiones y los
  # comandos salen de `mise.toml`, no de aqui. Asi no pueden separarse.
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 es la version con la que se desarrolla (ver mise.toml); 3.11 es
        # la mas antigua que promete el paquete (requires-python).
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          install: true
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Preparar el entorno
        run: mise run setup

      - name: Tests
        run: mise run test-py

  test-web:
    name: Interfaz web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Compilar la interfaz
        run: mise run web

      - name: Tests
        run: mise run test-web

  tipos:
    name: Tipos (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Preparar el entorno
        run: mise run setup

      - name: Comprobar los tipos
        run: mise run types

  guardarrailes:
    name: Guardarrailes (pre-commit)
    runs-on: ubuntu-latest
    env:
      # En la CI el checkout deja la rama 'main' montada, asi que el hook que
      # bloquea los commits en 'main' se salta aqui: ese hook solo tiene
      # sentido en el commit local.
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Preparar el entorno
        run: mise run setup

      - name: Ruff + hooks
        run: mise run lint
