name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Comprobar sintaxis (ruff)
        run: |
          pip install ruff==0.17.6
          ruff check --select=E9,F63,F7,F82 .

  web:
    name: Interfaz web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar
        run: npm run build

  guardarrails:
    name: Guardarrailes (pre-commit)
    runs-on: ubuntu-latest
    env:
      # En la CI el checkout deja la rama 'main' montada, asi que el hook que
      # bloquea los commits en 'main' se salta aqui: ese hook solo tiene
      # sentido en el commit local.
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: pre-commit/action@v3.0.1
