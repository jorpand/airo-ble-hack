# Hooks que se ejecutan antes de cada commit.
#
#     pip install pre-commit
#     pre-commit install
#
# Y para pasarlos sobre todo el repo:
#
#     pre-commit run --all-files
#
# Los mismos checks se ejecutan en la CI (ver .github/workflows/ci.yml).

exclude: '^(evidencia/|web/dist/)'

default_language_version:
  python: python3

repos:
  # --- Chequeos genericos de formato e higiene ---------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: forbid-submodules
      - id: no-commit-to-branch
        args: [--branch, main]

  # --- Python -------------------------------------------------------------
  # Solo se comprueban los errores que rompen el codigo (sintaxis, nombres
  # indefinidos). No se reformatea: el estilo del repo no se toca aqui.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # Ruff **arregla**, no solo avisa: con `fix = true` en pyproject.toml,
      # el hook deja los imports ordenados, quita lo que no se usa y
      # moderniza la sintaxis. Si toca ficheros, el commit se para: los
      # vuelves a anadir (`git add -u`) y ya esta.
      - id: ruff-check
        files: \.py$
        types: [python]

  # --- Secretos -----------------------------------------------------------
  # Corta el commit si alguien sube una clave, un token o una contrasena.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # --- Tipos --------------------------------------------------------------
  # Pyright en modo "standard" (ver [tool.pyright] en pyproject.toml). La
  # configuracion apunto al venv del proyecto, asi que ve bleak, fastapi...
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
