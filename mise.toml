# El entorno de desarrollo local del proyecto AIRO, TODO en un fichero.
#
# mise se encarga de las versiones, del venv y de los comandos. Con esto
# instalado, no hace falta ni activar un venv a mano ni acordarse de qué
# puerto usaba cada cosa:
#
#     mise install      # descarga Python 3.14 y Node 22
#     mise run setup    # crea el venv e instala el proyecto
#     mise run test     # pytest + vitest
#
# La lista de tareas: `mise tasks`

[tools]
#: La version con la que se desarrolla y se prueba. El codigo del paquete
#: sigue siendo compatible con 3.11+, pero aqui se trabaja con la ultima.
python = "3.14"
#: La misma que usa la CI.
node = "22"

[env]
#: El venv del proyecto. Todo (las tareas, los scripts, el editor) usa este
#: Python, no el del sistema.
AIRO_VENV = "{{config_root}}/.venv"
#: El interprete del venv, para no depender de que este en el PATH.
AIRO_PYTHON = "{{config_root}}/.venv/bin/python"
#: El puerto de la API web. El proxy de Vite y la interfaz apuntan aqui.
AIRO_PUERTO = "8100"
#: El puerto serie del ESP32-S3. Vacio = se busca solo el primero que
#: aparezca (ttyACM* para el USB nativo, ttyUSB* para el puente UART).
AIRO_SERIAL = ""
#: El firmware de MicroPython para el ESP32-S3 con PSRAM octal.
AIRO_FIRMWARE = "{{env.HOME}}/cache/airo-firmware/ESP32_GENERIC_S3-SPIRAM_OCT-v1.29.0.bin"

[tasks.setup]
description = "Crea el venv e instala el proyecto (Python + Node)"
run = [
  "python -m venv {{config_root}}/.venv",
  "$AIRO_PYTHON -m pip install --upgrade pip",
  "$AIRO_PYTHON -m pip install -e '.[dev]'",
  "cd {{config_root}}/web && npm ci",
]

[tasks.test]
description = "Pasa toda la suite (Python + web)"
depends = ["test-py", "test-web"]

[tasks.test-py]
description = "Pasa los tests de Python"
run = "$AIRO_PYTHON -m pytest -q"

[tasks.test-web]
description = "Pasa los tests de la interfaz"
run = "cd {{config_root}}/web && npm test"

[tasks.fix]
description = "Ruff arregla el codigo (imports, sintaxis vieja, lo que sobra)"
run = "$AIRO_PYTHON -m ruff check --fix ."

[tasks.lint]
description = "Ruff + los hooks de pre-commit (ruff tambien arregla)"
#: El hook que bloquea los commits en 'main' solo tiene sentido al commitear,
#: no al revisar el repo entero.
env = { SKIP = "no-commit-to-branch" }
run = [
  "$AIRO_PYTHON -m ruff check --fix .",
  "$AIRO_PYTHON -m pre_commit run --all-files",
]

[tasks.types]
description = "Comprueba los tipos con pyright"
run = "$AIRO_PYTHON -m pyright"

[tasks.web]
description = "Compila la interfaz (npm ci + npm run build)"
run = "cd {{config_root}}/web && npm ci && npm run build"

[tasks.web-dev]
description = "Arranca Vite en el 5173, para tocar la interfaz"
run = "cd {{config_root}}/web && npm run dev"

[tasks.web-gen]
description = "Regenera web/src/servos.js desde airo_ble/protocol.py"
run = "$AIRO_PYTHON tools/gen_servos.py"

[tasks.run]
description = "Arranca la API web con la interfaz"
run = "$AIRO_PYTHON -m uvicorn airo_ble.api.main:app --port $AIRO_PUERTO"

[tasks.console]
description = "Arranca la consola interactiva"
run = "$AIRO_PYTHON -m airo_ble.console"

[tasks.puente]
description = "Habla con el robot a traves del puente del ESP32-S3"
#: La URL del puente va en la variable de entorno AIRO_BRIDGE_URL (no se
#: pone aqui a proposito: mise pisaria lo que exporte el shell). Si no esta
#: puesta, se avisa en vez de hablar por Bluetooth sin querer.
run = """
if [ -z "$AIRO_BRIDGE_URL" ]; then
    echo "No hay URL de puente. Exporta AIRO_BRIDGE_URL, por ejemplo:"
    echo "    AIRO_BRIDGE_URL=http://airo-bridge.local:8080 mise run puente"
    exit 1
fi
echo "Puente: $AIRO_BRIDGE_URL"
$AIRO_PYTHON -m airo_ble.commands scan
"""

[tasks.scratch]
description = "Arranca el puente para el plugin de Scratch"
run = "$AIRO_PYTHON -m airo_ble.server"

[tasks.clean]
description = "Borra las caches y la build de la web"
run = """
find . -name '__pycache__' -type d -not -path './.venv/*' -not -path './web/node_modules/*' -exec rm -rf {} + 2>/dev/null || true
rm -rf .pytest_cache .ruff_cache web/dist
"""

[tasks.firmware-flash]
description = "Flashea el firmware de MicroPython en el ESP32-S3"
#: El puerto es AIRO_SERIAL (mise.toml); si esta vacio, se busca el primero
#: que aparezca. Con la placa en el USB nativo hay que mantener pulsado BOOT
#: al resetear; con el UART se hace solo.
run = """
PUERTO="${AIRO_SERIAL:-$(ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null | head -1)}"
if [ -z "$PUERTO" ]; then echo "no se encuentra el ESP32-S3 (¿esta enchufado?)"; exit 1; fi
echo "Puerto: $PUERTO"
$AIRO_PYTHON -m esptool --chip esp32s3 --port "$PUERTO" write_flash 0x0 $AIRO_FIRMWARE
"""

[tasks.firmware-run]
description = "Arranca el puente del ESP32-S3 (servidor HTTP y BLE)"
run = """
PUERTO="${AIRO_SERIAL:-$(ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null | head -1)}"
if [ -z "$PUERTO" ]; then echo "no se encuentra el ESP32-S3 (¿esta enchufado?)"; exit 1; fi
echo "Puerto: $PUERTO"
$AIRO_PYTHON -m mpremote connect "$PUERTO" run {{config_root}}/firmware/esp32/main.py
"""

[tasks.firmware-spike]
description = "Ejecuta el spike de la Fase 0 (escribe los 20 bytes y mueve el robot)"
#: Es lo que hay que hacer con el robot encendido: busca al robot, se
#: conecta, escribe el paquete de parar y el de avanzar un segundo.
run = """
PUERTO="${AIRO_SERIAL:-$(ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null | head -1)}"
if [ -z "$PUERTO" ]; then echo "no se encuentra el ESP32-S3 (¿esta enchufado?)"; exit 1; fi
echo "Puerto: $PUERTO"
$AIRO_PYTHON -m mpremote connect "$PUERTO" run {{config_root}}/firmware/esp32/spike.py
"""

[tasks.firmware-deploy]
description = "Copia todo el firmware a la placa y la reinicia"
#: Copia los ficheros del firmware a la placa y la reinicia (para que arranque
#: el puente con el codigo nuevo). OJO: todo lo que abra el puerto serie
#: interrumpe el programa que se este ejecutando, asi que al final se
#: reinicia siempre.
run = """
PUERTO="${AIRO_SERIAL:-$(ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null | head -1)}"
if [ -z "$PUERTO" ]; then echo "no se encuentra el ESP32-S3 (¿esta enchufado?)"; exit 1; fi
echo "Puerto: $PUERTO"
for f in main.py puente.py ble_robot.py http_srv.py wifi.py spike.py led.py; do
    $AIRO_PYTHON -m mpremote connect "$PUERTO" fs cp {{config_root}}/firmware/esp32/$f :$f
    sleep 1
done
$AIRO_PYTHON -m mpremote connect "$PUERTO" reset
"""

[tasks.firmware-logs]
description = "Muestra en el terminal lo que dice la placa por el puerto serie"
#: Con el USB nativo, abrir el puerto no reinicia la placa, asi que se
#: reinicia a proposito (secuencia DTR/RTS) para ver el log de arranque.
run = """
PUERTO="${AIRO_SERIAL:-$(ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null | head -1)}"
if [ -z "$PUERTO" ]; then echo "no se encuentra el ESP32-S3 (¿esta enchufado?)"; exit 1; fi
echo "Puerto: $PUERTO"
$AIRO_PYTHON {{config_root}}/tools/firmware/logs.py --port "$PUERTO" --reset
"""

[tasks.firmware-wifi]
description = "Copia las credenciales de la WiFi a la placa y se conecta"
#: Las credenciales estan en firmware/esp32/wifi.json, que NO se versiona
#: (copia wifi.example.json y pon tus datos). Se copian a la placa y se
#: comprueba la conexion.
run = """
PUERTO="${AIRO_SERIAL:-$(ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null | head -1)}"
if [ -z "$PUERTO" ]; then echo "no se encuentra el ESP32-S3 (¿esta enchufado?)"; exit 1; fi
CONFIG={{config_root}}/firmware/esp32/wifi.json
if [ ! -f "$CONFIG" ]; then
    echo "Falta $CONFIG"
    echo "Copia el ejemplo y pon tus datos:"
    echo "    cp {{config_root}}/firmware/esp32/wifi.example.json $CONFIG"
    exit 1
fi
$AIRO_PYTHON -m mpremote connect "$PUERTO" fs cp "$CONFIG" :wifi.json
$AIRO_PYTHON -m mpremote connect "$PUERTO" fs cp {{config_root}}/firmware/esp32/wifi.py :wifi.py
$AIRO_PYTHON -m mpremote connect "$PUERTO" exec "import wifi; wifi.conectar()"
"""
