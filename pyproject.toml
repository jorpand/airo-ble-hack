[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airo-ble"
version = "1.0.0"
description = "Cliente BLE del robot Clementoni AIRO (habla su idioma de 20 bytes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "airo-ble" }]
keywords = ["airo", "clementoni", "robot", "ble", "bluetooth"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

# La libreria en si solo solo necesita bleak: nada de web, nada de interfaz.
dependencies = [
    "bleak>=0.19",
]

[project.optional-dependencies]
# La API web (FastAPI + Pydantic) es opcional.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]
# El puente para Scratch.
scratch = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]
dev = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "playwright>=1.40",
    # El TestClient de FastAPI necesita un cliente HTTP: starlette 1.x usa
    # httpx2 y las versiones antiguas, httpx. Se instalan los dos.
    "httpx>=0.27",
    "httpx2>=2.0",
    # Los hooks de pre-commit y el chequeo de tipos.
    "pre-commit>=3.6",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
    # Para los scripts de desensamblado (tools/rev).
    "capstone>=5.0",
]

[project.scripts]
# La CLI de una vez (scan, drive, pose, led...).
airo = "airo_ble.commands:main"
# La consola interactiva (con historial y `ayuda`).
airo-console = "airo_ble.console:main"
# El puente para el plugin de Scratch.
airo-server = "airo_ble.server:main"

[project.urls]
Homepage = "https://github.com/jorpand/airo-ble-hack"
Repository = "https://github.com/jorpand/airo-ble-hack"
Issues = "https://github.com/jorpand/airo-ble-hack/issues"
Documentacion = "https://github.com/jorpand/airo-ble-hack/blob/main/docs/protocolo.md"

[tool.setuptools]
packages = ["airo_ble", "airo_ble.api", "airo_ble.scratch3_airo"]

[tool.setuptools.package-data]
airo_ble = ["py.typed", "calibration.json"]
"airo_ble.scratch3_airo" = ["*.js", "*.html", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# La raiz del repo en el path, para poder importar `airo_ble` sin instalar.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Los avisos de deprecacion que salen de NUESTRO codigo son un error: asi
# no se puede volver a usar algo que FastAPI (o bleak) ya no recomienda.
# Los de terceros se quedan como aviso, para no depender de ellos.
filterwarnings = [
    "error::DeprecationWarning:airo_ble.*",
    "error::PendingDeprecationWarning:airo_ble.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
#: ruff **arregla**, no solo avisa: `ruff check` aplica las correcciones
#: automaticas (los imports sin usar, los imports sin ordenar, la sintaxis
#: vieja...). El hook de pre-commit tambien las aplica, asi que commitear
#: deja el codigo limpio.
fix = true
# Carpetas que no son codigo nuestro (artefactos y material de reversing).
extend-exclude = [
    ".venv-3.14",
    "web",
    "evidencia",
    "tools",
]

# Las reglas de ruff. No se reformatea el repo a lo bruto: no esta el
# formateador (black), solo las correcciones que se pueden hacer solas.
#
#   E, W   estilo (lineas largas, espacios...)
#   F      pyflakes: imports y variables sin usar, errores de nombre
#   I      imports ordenados
#   UP     sintaxis moderna (python 3.11+)
#   B      bugbear: errores que no son de sintaxis pero son bugs
#   C4     comprehensiones
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pyright]
#: La libreria (lo que se instala) y los tests. Los scripts de tools/ que
#: no son del paquete (los de reversing y los de medicion) se dejan fuera:
#: dependen de herramientas externas y de un robot.
include = ["airo_ble", "tests", "tools/gen_servos.py", "firmware"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv*",
    "web",
    "evidencia",
    "build",
    "dist",
]
#: Stubs de los modulos de MicroPython (el firmware del ESP32 corre en
#: MicroPython, no en CPython, asi que `bluetooth` no existe aqui).
stubPath = "firmware/stubs"
#: El venv del proyecto: asi pyright ve bleak, fastapi, pydantic...
#: Es el que crea `mise run setup`.
venvPath = "."
venv = ".venv"
#: Donde esta `disasm.py`, que usan los scripts de tools/hardware/.
extraPaths = ["tools/rev"]
#: La version con la que se desarrolla (ver mise.toml). Si se usa algo mas
#: nuevo, lo pilla la CI, que prueba tambien con 3.11 (la mas antigua que
#: promete el paquete).
pythonVersion = "3.14"
#: "standard" es lo que aguanta el codigo entero sin quejarse. "strict" esta
#: a un paso (avisa sobre todo de los tests que tocan interiores).
typeCheckingMode = "standard"
reportMissingTypeStubs = false
#: El firmware usa stubs de MicroPython (firmware/stubs): ahi no hay fuente
#: que mirar, solo la forma de la API.
reportMissingModuleSource = "none"
#: Avisar de lo que esta deprecado: es lo que mas duele cuando Python se
#: mueve (por ejemplo, en 3.14 `@asynccontextmanager` pide `AsyncGenerator`
#: en vez de `AsyncIterator`).
reportDeprecated = "error"
